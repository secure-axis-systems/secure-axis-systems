<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/secure-axis-systems/engineering/favicon.svg?v=3" />
    <meta name="description" content="منصة هندسية لحساب وتصميم أنظمة كاميرات المراقبة" />
    <title>SECURE AXIS | منصة هندسة أنظمة المراقبة</title>
    <script type="module" crossorigin src="/secure-axis-systems/engineering/assets/index-no-access.js"></script>
    <link rel="stylesheet" crossorigin href="/secure-axis-systems/engineering/assets/index-mobile-dark.css">
  <style>#accessControl{display:none!important}</style>
  </head>
  <body>
    <div id="root"></div>
  <script>
(function(){
  try { document.documentElement.dataset.theme = localStorage.getItem("secure-axis-theme") || "light"; } catch (_) { document.documentElement.dataset.theme = "light"; }
  function addThemeToggle(){
    var host=document.querySelector(".header-actions");
    if(!host||document.getElementById("themeToggle")) return false;
    var button=document.createElement("button");
    button.type="button"; button.id="themeToggle"; button.className="theme-toggle";
    button.addEventListener("click",function(){
      var next=document.documentElement.dataset.theme==="dark"?"light":"dark";
      document.documentElement.dataset.theme=next;
      button.textContent=next==="dark"?"☀️":"🌙";
      button.setAttribute("aria-label",next==="dark"?"Switch to light mode":"Switch to dark mode");
      button.title=button.getAttribute("aria-label");
      try{localStorage.setItem("secure-axis-theme",next)}catch(_){}
      var meta=document.querySelector('meta[name="theme-color"]'); if(meta)meta.content=next==="dark"?"#0b1118":"#ffffff";
    });
    var dark=document.documentElement.dataset.theme==="dark";
    button.textContent=dark?"☀️":"🌙";
    button.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
    button.title=button.getAttribute("aria-label");
    host.prepend(button);
    return true;
  }
  if(!addThemeToggle()){
    var observer=new MutationObserver(function(){if(addThemeToggle())observer.disconnect()});
    observer.observe(document.documentElement,{childList:true,subtree:true});
  }
})();
</script>\n  </body>
</html>
